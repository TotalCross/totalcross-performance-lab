name: Android customer Main.zip reproducer (TotalCross 7.3.0)

on:
  push:
    branches:
      - test/android-client-main
    paths:
      - .github/workflows/android-client-main.yml
      - tests/android-client-main/**
      - tools/android_client_main_build.py
      - tools/android_client_main_test.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-client-main:
    name: Original client Main.java / Android 15 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify scripts compile and original Java source exists
        shell: bash
        run: |
          python -m py_compile tools/android_client_main_build.py tools/android_client_main_test.py
          test -f tests/android-client-main/original/Main.java
          test -f tests/android-client-main/original/TestPermission.java
      - name: Fetch exact official TotalCross 7.3.0 SDK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERFORMANCE_LAB_GH_TOKEN || github.token }}
        run: |
          mkdir -p android-client-main-results
          gh api repos/TotalCross/totalcross/actions/runs/40878222908 --jq '{id,head_sha,conclusion,name}' > android-client-main-results/upstream-run.json
          test "$(gh api repos/TotalCross/totalcross/actions/runs/40878222908 --jq .head_sha)" = "5464c21e3107e3f1ce9c287b724829e2bb870c1d"
          test "$(gh api repos/TotalCross/totalcross/actions/runs/40878222908 --jq .conclusion)" = "success"
          gh api repos/TotalCross/totalcross/actions/artifacts/12899147776/zip > android-client-main-results/official-artifact.zip
          python -m zipfile -t android-client-main-results/official-artifact.zip
      - name: Build exact customer sources and diagnostic-only clone
        shell: bash
        run: |
          python tools/android_client_main_build.py \
            --package android-client-main-results/official-artifact.zip \
            --out android-client-main-results
      - name: Boot Android 15 emulator and test client's original MainWindow and File
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 600
          disable-animations: true
          script: python3 tools/android_client_main_test.py --out android-client-main-results --timeout 65
      - name: Report detailed diagnostics if Android test fails
        if: failure()
        shell: bash
        run: |
          for f in android-client-main-results/customer-main-execution-summary.json android-client-main-results/build-summary.json android-client-main-results/exact/compile.log android-client-main-results/trace/compile.log android-client-main-results/exact/deploy.log android-client-main-results/trace/deploy.log; do
            if test -f "$f"; then echo "=== $f ==="; tail -n 120 "$f"; fi
          done
          grep -R -iE 'TC_CLIENT_MAIN|Permission denied|Exception|AndroidRuntime' \
            android-client-main-results/*-logcat.txt 2>/dev/null | tail -n 100 || true
      - name: Archive customer APKs, screenshots, logcat and pass/fail summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-client-main-7.3.0-reproducer
          path: |
            android-client-main-results/
            !android-client-main-results/official-sdk/**
            !android-client-main-results/official-artifact.zip
            !android-client-main-results/exact/classes/**
            !android-client-main-results/trace/classes/**
          retention-days: 30
          if-no-files-found: warn
