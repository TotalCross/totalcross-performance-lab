name: Android 10 storage permission emulator (no TotalCross VM)
run-name: Android API29 7.3.0 coordinator permission emulators without VM

on:
  push:
    branches:
      - test/android10-storage-permission-emulator
    paths:
      - .github/workflows/android-permission-emulator-no-vm.yml
      - experiments/android-permission-emulator/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permission-emulator:
    name: Android ${{ matrix.api }} / targetSdk ${{ matrix.target_sdk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target_sdk: 29
          - api: 29
            target_sdk: 36
    env:
      EXP: experiments/android-permission-emulator

    steps:
      - name: Checkout standalone experiment
        uses: actions/checkout@v4
      - name: Checkout exact TotalCross 7.3.0 Java coordinator (read-only)
        uses: actions/checkout@v4
        with:
          repository: TotalCross/totalcross
          ref: 5464c21e3107e3f1ce9c287b724829e2bb870c1d
          path: tc730-exact
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            TotalCrossVM/android/app/src/main/java/totalcross/android/AndroidPermissionManager.java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (only standalone experiment)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Install Android SDK platform 36 and copy exact manager
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
          actual="$(git -C tc730-exact rev-parse HEAD)"
          test "$actual" = "5464c21e3107e3f1ce9c287b724829e2bb870c1d"
          cp tc730-exact/TotalCrossVM/android/app/src/main/java/totalcross/android/AndroidPermissionManager.java "$EXP/app/src/main/java/totalcross/android/"
          sha256sum "$EXP/app/src/main/java/totalcross/android/AndroidPermissionManager.java"
      - name: Compile standalone Java APK (NEVER compile TotalCross VM)
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$EXP" --no-daemon --stacktrace :app:assembleDebug "-PprobeTargetSdk=${{ matrix.target_sdk }}"
          test -s "$EXP/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p "emulator-results/target-${{ matrix.target_sdk }}"
          cp "$EXP/app/build/outputs/apk/debug/app-debug.apk" "emulator-results/target-${{ matrix.target_sdk }}/standalone-permission-probe.apk"
      - name: Enable KVM on Linux runner
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run API29 emulator with explicit permission scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: >-
            python3 experiments/android-permission-emulator/run_emulator.py
            --apk experiments/android-permission-emulator/app/build/outputs/apk/debug/app-debug.apk
            --out emulator-results/target-${{ matrix.target_sdk }}/observations
            --target-sdk ${{ matrix.target_sdk }}
      - name: Upload evidence and APK (even if test fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android29-permission-target${{ matrix.target_sdk }}-no-vm
          path: emulator-results/
          retention-days: 30
          if-no-files-found: warn
