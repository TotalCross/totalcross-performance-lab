name: TotalCross 7.3.0 Linux functional validation

on:
  push:
    branches:
      - investigation/totalcross-7.3.0-functional-validation
    paths:
      - '.github/workflows/functional-validation-730.yml'
      - 'tools/functional_validation_730.py'
      - 'tools/linux_image_ownership_730.py'
      - 'tests/functional-validation/LinuxStartupProbe.java'
      - 'tests/functional-validation/LinuxPngDecodeProbe.java'
      - 'tests/functional-validation/totalcross/ui/image/ImageOwnershipLifecycleProbe.java'
      - 'investigations/7.3.0-functional/campaign-run.json'
      - 'investigations/7.3.0-functional/cases/linux-startup/**'
      - 'investigations/7.3.0-functional/cases/png-decoding/**'
      - 'investigations/7.3.0-functional/cases/image-ownership/**'

permissions:
  contents: read

jobs:
  build-frozen-master:
    name: Build frozen master Linux package
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Check out frozen product source
        uses: actions/checkout@v4
        with:
          repository: TotalCross/totalcross
          ref: 6b915883dd202f6db891990f6c3af26fb645ecc7
          path: product
          fetch-depth: 1

      - name: Check out corrected product source
        uses: actions/checkout@v4
        with:
          repository: TotalCross/totalcross
          ref: 94af2b8b653cad509994b5ccf3dbb60ac28ef920
          path: product-candidate
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build SDK with the canonical packaging script
        working-directory: product/scripts
        run: ./package-sdk.sh

      - name: Build corrected SDK with the canonical packaging script
        working-directory: product-candidate/scripts
        env:
          LOG_PATH: ${{ runner.temp }}/tc730-candidate-sdk-build.log
        run: |
          if ./package-sdk.sh > "$LOG_PATH" 2>&1; then
            echo "Corrected SDK package build passed; log: $LOG_PATH"
          else
            status=$?
            tail -n 100 "$LOG_PATH"
            echo "Corrected SDK package build failed with exit $status; log: $LOG_PATH" >&2
            exit "$status"
          fi

      - name: Fetch pinned native dependencies
        working-directory: product
        env:
          PREPARED_NATIVE_DEPENDENCIES_INDEX: ${{ runner.temp }}/tc730-native-dependencies.jsonl
          TOTALCROSS_DEPOT_TOOLS_REF: 0fd3c98727c87a441bc9c8d2c8dd2b731ef0861a
          SQLITE3_GITHUB_TOKEN: ${{ secrets.SQLITE3_GITHUB_TOKEN }}
          ZLIB_NG_GITHUB_TOKEN: ${{ secrets.ZLIB_NG_GITHUB_TOKEN }}
          MINIZIP_NG_GITHUB_TOKEN: ${{ secrets.MINIZIP_NG_GITHUB_TOKEN }}
          LIBPNG_GITHUB_TOKEN: ${{ secrets.LIBPNG_GITHUB_TOKEN }}
          MBEDTLS_GITHUB_TOKEN: ${{ secrets.MBEDTLS_GITHUB_TOKEN }}
          AXTLS_GITHUB_TOKEN: ${{ secrets.AXTLS_GITHUB_TOKEN }}
          QRCODEGEN_GITHUB_TOKEN: ${{ secrets.QRCODEGEN_GITHUB_TOKEN }}
          LIBJPEG_TURBO_GITHUB_TOKEN: ${{ secrets.LIBJPEG_TURBO_GITHUB_TOKEN }}
          SKIA_GITHUB_TOKEN: ${{ secrets.SKIA_GITHUB_TOKEN }}
          SDL2_GITHUB_TOKEN: ${{ secrets.SDL2_GITHUB_TOKEN }}
          SQLITE3_RELEASE_TAG: ${{ secrets.SQLITE3_RELEASE_TAG }}
          SQLITE3_GITHUB_REPO: ${{ secrets.SQLITE3_GITHUB_REPO }}
          ZLIB_NG_RELEASE_TAG: ${{ secrets.ZLIB_NG_RELEASE_TAG }}
          ZLIB_NG_GITHUB_REPO: ${{ secrets.ZLIB_NG_GITHUB_REPO }}
          MINIZIP_NG_RELEASE_TAG: ${{ secrets.MINIZIP_NG_RELEASE_TAG }}
          MINIZIP_NG_GITHUB_REPO: ${{ secrets.MINIZIP_NG_GITHUB_REPO }}
          LIBPNG_RELEASE_TAG: ${{ secrets.LIBPNG_RELEASE_TAG }}
          LIBPNG_GITHUB_REPO: ${{ secrets.LIBPNG_GITHUB_REPO }}
          MBEDTLS_RELEASE_TAG: ${{ secrets.MBEDTLS_RELEASE_TAG }}
          MBEDTLS_GITHUB_REPO: ${{ secrets.MBEDTLS_GITHUB_REPO }}
          AXTLS_RELEASE_TAG: ${{ secrets.AXTLS_RELEASE_TAG }}
          AXTLS_GITHUB_REPO: ${{ secrets.AXTLS_GITHUB_REPO }}
          QRCODEGEN_RELEASE_TAG: ${{ secrets.QRCODEGEN_RELEASE_TAG }}
          QRCODEGEN_GITHUB_REPO: ${{ secrets.QRCODEGEN_GITHUB_REPO }}
          LIBJPEG_TURBO_RELEASE_TAG: ${{ secrets.LIBJPEG_TURBO_RELEASE_TAG }}
          LIBJPEG_TURBO_GITHUB_REPO: ${{ secrets.LIBJPEG_TURBO_GITHUB_REPO }}
          SKIA_RELEASE_TAG: ${{ secrets.SKIA_RELEASE_TAG }}
          SKIA_GITHUB_REPO: ${{ secrets.SKIA_GITHUB_REPO }}
          SDL2_RELEASE_TAG: ${{ secrets.SDL2_RELEASE_TAG }}
          SDL2_GITHUB_REPO: ${{ secrets.SDL2_GITHUB_REPO }}
        run: |
          TotalCrossVM/deps/fetch-depot-tools.sh
          scripts/prepare-native-dependencies.sh

      - name: Generate native bridge sources
        working-directory: product/TotalCrossSDK
        run: ./gradlew-agent generateNativeBridgeSources

      - name: Verify corrected SDK generates identical native bridges
        working-directory: product-candidate/TotalCrossSDK
        env:
          BASELINE_BRIDGES: ${{ github.workspace }}/product/TotalCrossSDK/build/generated/native-bridges
          CANDIDATE_BRIDGES: ${{ github.workspace }}/product-candidate/TotalCrossSDK/build/generated/native-bridges
          LOG_PATH: ${{ runner.temp }}/tc730-candidate-native-bridges.log
        run: |
          if ./gradlew-agent generateNativeBridgeSources > "$LOG_PATH" 2>&1; then
            echo "Corrected SDK native bridge generation passed; log: $LOG_PATH"
          else
            status=$?
            tail -n 100 "$LOG_PATH"
            echo "Corrected SDK native bridge generation failed with exit $status; log: $LOG_PATH" >&2
            exit "$status"
          fi
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          def inventory(root):
              root = Path(root)
              if not root.is_dir():
                  raise SystemExit("generated native bridge directory is missing: " + str(root))
              files = sorted(path for path in root.rglob("*") if path.is_file())
              return {path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in files}

          baseline = inventory(os.environ["BASELINE_BRIDGES"])
          candidate = inventory(os.environ["CANDIDATE_BRIDGES"])
          if baseline != candidate:
              raise SystemExit("corrected SDK changes generated native bridge inputs")
          digest = hashlib.sha256()
          for name, file_hash in sorted(candidate.items()):
              digest.update(name.encode("utf-8") + b"\0" + file_hash.encode("ascii") + b"\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("GENERATED_NATIVE_BRIDGES_SHA256=" + digest.hexdigest() + "\n")
          print("Identical generated native bridge files: %d; inventory SHA-256: %s" %
                (len(candidate), digest.hexdigest()))
          PY

      - name: Build Linux VM and launcher with the canonical container
        working-directory: product
        env:
          SQLITE3_GITHUB_TOKEN: ${{ secrets.SQLITE3_GITHUB_TOKEN }}
          ZLIB_NG_GITHUB_TOKEN: ${{ secrets.ZLIB_NG_GITHUB_TOKEN }}
          MINIZIP_NG_GITHUB_TOKEN: ${{ secrets.MINIZIP_NG_GITHUB_TOKEN }}
          LIBPNG_GITHUB_TOKEN: ${{ secrets.LIBPNG_GITHUB_TOKEN }}
          MBEDTLS_GITHUB_TOKEN: ${{ secrets.MBEDTLS_GITHUB_TOKEN }}
          AXTLS_GITHUB_TOKEN: ${{ secrets.AXTLS_GITHUB_TOKEN }}
          QRCODEGEN_GITHUB_TOKEN: ${{ secrets.QRCODEGEN_GITHUB_TOKEN }}
          LIBJPEG_TURBO_GITHUB_TOKEN: ${{ secrets.LIBJPEG_TURBO_GITHUB_TOKEN }}
          SKIA_GITHUB_TOKEN: ${{ secrets.SKIA_GITHUB_TOKEN }}
          SDL2_GITHUB_TOKEN: ${{ secrets.SDL2_GITHUB_TOKEN }}
          SQLITE3_RELEASE_TAG: ${{ secrets.SQLITE3_RELEASE_TAG }}
          SQLITE3_GITHUB_REPO: ${{ secrets.SQLITE3_GITHUB_REPO }}
          ZLIB_NG_RELEASE_TAG: ${{ secrets.ZLIB_NG_RELEASE_TAG }}
          ZLIB_NG_GITHUB_REPO: ${{ secrets.ZLIB_NG_GITHUB_REPO }}
          MINIZIP_NG_RELEASE_TAG: ${{ secrets.MINIZIP_NG_RELEASE_TAG }}
          MINIZIP_NG_GITHUB_REPO: ${{ secrets.MINIZIP_NG_GITHUB_REPO }}
          LIBPNG_RELEASE_TAG: ${{ secrets.LIBPNG_RELEASE_TAG }}
          LIBPNG_GITHUB_REPO: ${{ secrets.LIBPNG_GITHUB_REPO }}
          MBEDTLS_RELEASE_TAG: ${{ secrets.MBEDTLS_RELEASE_TAG }}
          MBEDTLS_GITHUB_REPO: ${{ secrets.MBEDTLS_GITHUB_REPO }}
          AXTLS_RELEASE_TAG: ${{ secrets.AXTLS_RELEASE_TAG }}
          AXTLS_GITHUB_REPO: ${{ secrets.AXTLS_GITHUB_REPO }}
          QRCODEGEN_RELEASE_TAG: ${{ secrets.QRCODEGEN_RELEASE_TAG }}
          QRCODEGEN_GITHUB_REPO: ${{ secrets.QRCODEGEN_GITHUB_REPO }}
          LIBJPEG_TURBO_RELEASE_TAG: ${{ secrets.LIBJPEG_TURBO_RELEASE_TAG }}
          LIBJPEG_TURBO_GITHUB_REPO: ${{ secrets.LIBJPEG_TURBO_GITHUB_REPO }}
          SKIA_RELEASE_TAG: ${{ secrets.SKIA_RELEASE_TAG }}
          SKIA_GITHUB_REPO: ${{ secrets.SKIA_GITHUB_REPO }}
          SDL2_RELEASE_TAG: ${{ secrets.SDL2_RELEASE_TAG }}
          SDL2_GITHUB_REPO: ${{ secrets.SDL2_GITHUB_REPO }}
        run: |
          mkdir -p build
          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          python3 - "$source_commit" "$source_tree" > build-provenance.json <<'PY'
          import json
          import sys

          print(json.dumps({
              "schemaVersion": 1,
              "repository": "TotalCross/totalcross",
              "source": {
                  "commit": sys.argv[1],
                  "tree": sys.argv[2],
                  "dirty": False,
              },
          }, sort_keys=True))
          PY
          docker_env_args=(
            -e SQLITE3_GITHUB_TOKEN -e ZLIB_NG_GITHUB_TOKEN
            -e MINIZIP_NG_GITHUB_TOKEN
            -e LIBPNG_GITHUB_TOKEN -e MBEDTLS_GITHUB_TOKEN
            -e AXTLS_GITHUB_TOKEN -e QRCODEGEN_GITHUB_TOKEN
            -e LIBJPEG_TURBO_GITHUB_TOKEN -e SKIA_GITHUB_TOKEN
            -e SDL2_GITHUB_TOKEN
          )
          for env_name in \
            SQLITE3_RELEASE_TAG SQLITE3_GITHUB_REPO \
            ZLIB_NG_RELEASE_TAG ZLIB_NG_GITHUB_REPO \
            MINIZIP_NG_RELEASE_TAG MINIZIP_NG_GITHUB_REPO \
            LIBPNG_RELEASE_TAG LIBPNG_GITHUB_REPO \
            MBEDTLS_RELEASE_TAG MBEDTLS_GITHUB_REPO \
            AXTLS_RELEASE_TAG AXTLS_GITHUB_REPO \
            QRCODEGEN_RELEASE_TAG QRCODEGEN_GITHUB_REPO \
            LIBJPEG_TURBO_RELEASE_TAG LIBJPEG_TURBO_GITHUB_REPO \
            SKIA_RELEASE_TAG SKIA_GITHUB_REPO \
            SDL2_RELEASE_TAG SDL2_GITHUB_REPO
          do
            if [ -n "${!env_name:-}" ]; then
              docker_env_args+=(-e "$env_name")
            fi
          done
          docker run --platform linux/amd64 \
            "${docker_env_args[@]}" \
            -v "$PWD/build:/build" -v "$PWD:/sources" -w /build \
            totalcross/linux-amd64:v1.0.7 bash -lc '
              set -e
              { cmake --version | head -n 1; c++ --version | head -n 1; ninja --version; } > /build/native-toolchain.txt
              cmake /sources/TotalCrossVM -DCMAKE_BUILD_TYPE=Release -G Ninja
              ninja
            '

      - name: Assemble the frozen SDK and native runtime bundle
        env:
          BUNDLE_DIR: ${{ runner.temp }}/tc730-linux-bundle
          SOURCE_SHA: 6b915883dd202f6db891990f6c3af26fb645ecc7
          CANDIDATE_SOURCE_SHA: 94af2b8b653cad509994b5ccf3dbb60ac28ef920
          DEPOT_TOOLS_REF: 0fd3c98727c87a441bc9c8d2c8dd2b731ef0861a
          DEPENDENCY_INDEX: ${{ runner.temp }}/tc730-native-dependencies.jsonl
        run: |
          mkdir -p "$BUNDLE_DIR/TotalCross" "$BUNDLE_DIR/Corrected/TotalCross" "$BUNDLE_DIR/native"
          cp -a product/build/TotalCross/. "$BUNDLE_DIR/TotalCross/"
          cp -a product-candidate/build/TotalCross/. "$BUNDLE_DIR/Corrected/TotalCross/"
          cp product/build/libtcvm.so "$BUNDLE_DIR/native/libtcvm.so"
          cp product/build/Launcher "$BUNDLE_DIR/native/Launcher"
          cp product/build/native-toolchain.txt "$BUNDLE_DIR/native-toolchain.txt"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["BUNDLE_DIR"])
          def sha(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          depot_revision = subprocess.check_output([
              "git", "-C", "product/TotalCrossVM/deps/totalcross-depot-tools",
              "rev-parse", "HEAD"], text=True).strip()
          if depot_revision != os.environ["DEPOT_TOOLS_REF"]:
              raise SystemExit("depot-tools revision differs from the pinned campaign ref")

          def product_identity(path):
              commit = subprocess.check_output(["git", "-C", path, "rev-parse", "HEAD"], text=True).strip()
              tree = subprocess.check_output(["git", "-C", path, "rev-parse", "HEAD^{tree}"], text=True).strip()
              vm_tree = subprocess.check_output(["git", "-C", path, "rev-parse", "HEAD:TotalCrossVM"], text=True).strip()
              return commit, tree, vm_tree

          baseline_commit, baseline_tree, baseline_vm_tree = product_identity("product")
          candidate_commit, candidate_tree, candidate_vm_tree = product_identity("product-candidate")
          if baseline_commit != os.environ["SOURCE_SHA"]:
              raise SystemExit("frozen source checkout differs from the pinned revision")
          if candidate_commit != os.environ["CANDIDATE_SOURCE_SHA"]:
              raise SystemExit("corrected source checkout differs from the pinned revision")
          if baseline_vm_tree != candidate_vm_tree:
              raise SystemExit("corrected source changes TotalCrossVM inputs")
          bridge_hash = os.environ["GENERATED_NATIVE_BRIDGES_SHA256"]

          record = {
              "sourceSha": os.environ["SOURCE_SHA"],
              "sourceTree": baseline_tree,
              "totalCrossVmTree": baseline_vm_tree,
              "generatedNativeBridgesSha256": bridge_hash,
              "buildImage": "totalcross/linux-amd64:v1.0.7",
              "depotToolsRevision": depot_revision,
              "sdkJarSha256": sha(root / "TotalCross/dist/totalcross-sdk.jar"),
              "linuxLibtcvmSha256": sha(root / "native/libtcvm.so"),
              "linuxLauncherSha256": sha(root / "native/Launcher"),
              "nativeToolchainSha256": sha(root / "native-toolchain.txt"),
              "dependencyIndexSha256": sha(Path(os.environ["DEPENDENCY_INDEX"])),
              "preparedDependencies": [
                  {key: item[key] for key in ("dependency", "platform", "arch", "release_tag", "sha256")
                   if key in item}
                  for item in (json.loads(line) for line in Path(os.environ["DEPENDENCY_INDEX"]).read_text().splitlines())
              ],
          }
          (root / "build-identity.json").write_text(json.dumps(record, indent=2) + "\n")
          candidate = {
              "sourceSha": candidate_commit,
              "sourceTree": candidate_tree,
              "totalCrossVmTree": candidate_vm_tree,
              "nativeSourceTreeMatchesBaseline": candidate_vm_tree == baseline_vm_tree,
              "generatedNativeBridgesSha256": bridge_hash,
              "nativeBridgeInputsMatchBaseline": True,
              "sdkJarSha256": sha(root / "Corrected/TotalCross/dist/totalcross-sdk.jar"),
              "runtimePairing": "same frozen-master Linux runtime; TotalCrossVM source subtree and generated native bridge inputs were verified byte-identical",
          }
          (root / "corrected-sdk-build-identity.json").write_text(
              json.dumps(candidate, indent=2) + "\n")
          print(json.dumps(record))
          print(json.dumps(candidate))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tc730-linux-frozen-master-bundle
          path: ${{ runner.temp }}/tc730-linux-bundle
          retention-days: 1
          if-no-files-found: error

  run-linux-image-ownership:
    name: Run image ownership on Linux x86_64
    needs: build-frozen-master
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tc730-linux-frozen-master-bundle
          path: ${{ runner.temp }}/tc730-linux-bundle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the headless Linux runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb libsdl2-2.0-0 libgl1 libegl1 libgles2 libglu1-mesa libx11-6 libxext6 libxrender1 libfontconfig1

      - name: Verify paired SDK and native runtime provenance
        env:
          BUNDLE_DIR: ${{ runner.temp }}/tc730-linux-bundle
          RESULT_DIR: ${{ runner.temp }}/tc730-image-ownership-results
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          jq -e '.sourceSha == "6b915883dd202f6db891990f6c3af26fb645ecc7" and .sourceTree != null and .totalCrossVmTree != null' \
            "$BUNDLE_DIR/build-identity.json" >/dev/null
          jq -e '.sourceSha == "94af2b8b653cad509994b5ccf3dbb60ac28ef920" and .nativeSourceTreeMatchesBaseline == true and .nativeBridgeInputsMatchBaseline == true' \
            "$BUNDLE_DIR/corrected-sdk-build-identity.json" >/dev/null
          python3 - "$BUNDLE_DIR" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          baseline = json.loads((root / "build-identity.json").read_text())
          candidate = json.loads((root / "corrected-sdk-build-identity.json").read_text())
          def sha(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          checks = {
              "baselineSdkJar": (root / "TotalCross/dist/totalcross-sdk.jar",
                                 baseline["sdkJarSha256"]),
              "candidateSdkJar": (root / "Corrected/TotalCross/dist/totalcross-sdk.jar",
                                  candidate["sdkJarSha256"]),
              "linuxLibtcvm": (root / "native/libtcvm.so", baseline["linuxLibtcvmSha256"]),
              "linuxLauncher": (root / "native/Launcher", baseline["linuxLauncherSha256"]),
          }
          for name, (path, expected) in checks.items():
              actual = sha(path)
              if actual != expected:
                  raise SystemExit(name + " does not match its recorded build identity")
          if baseline["totalCrossVmTree"] != candidate["totalCrossVmTree"]:
              raise SystemExit("baseline and corrected TotalCrossVM source trees differ")
          if baseline["generatedNativeBridgesSha256"] != candidate["generatedNativeBridgesSha256"]:
              raise SystemExit("baseline and corrected generated native bridge inputs differ")
          print("SDK and Linux runtime files match their build identities; native inputs are equivalent")
          PY
          python3 - "$RESULT_DIR/identities.json" "$BUNDLE_DIR/build-identity.json" \
            "$BUNDLE_DIR/corrected-sdk-build-identity.json" <<'PY'
          import json
          import platform
          import sys
          from pathlib import Path

          baseline = json.loads(Path(sys.argv[2]).read_text())
          candidate = json.loads(Path(sys.argv[3]).read_text())
          record = {
              "platform": "linux-x86_64",
              "runtimeHostArchitecture": platform.machine(),
              "baseline": baseline,
              "candidate": candidate,
              "runtimeLibrarySha256": baseline["linuxLibtcvmSha256"],
              "runtimeLauncherSha256": baseline["linuxLauncherSha256"],
          }
          Path(sys.argv[1]).write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps({key: value for key, value in record.items()
                            if key not in ("baseline", "candidate")}, sort_keys=True))
          PY
          ldd --version | head -n 1 > "$RESULT_DIR/glibc-version.txt"
          uname -a > "$RESULT_DIR/host.txt"

      - name: Prepare and run baseline ownership observation
        env:
          BUNDLE_DIR: ${{ runner.temp }}/tc730-linux-bundle
          RESULT_DIR: ${{ runner.temp }}/tc730-image-ownership-results
          PROBE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          baseline_source="$(jq -r .sourceSha "$BUNDLE_DIR/build-identity.json")"
          baseline_tree="$(jq -r .sourceTree "$BUNDLE_DIR/build-identity.json")"
          vm_tree="$(jq -r .totalCrossVmTree "$BUNDLE_DIR/corrected-sdk-build-identity.json")"
          bridge_hash="$(jq -r .generatedNativeBridgesSha256 "$BUNDLE_DIR/corrected-sdk-build-identity.json")"
          python3 tools/linux_image_ownership_730.py prepare \
            --sdk-root "$BUNDLE_DIR/TotalCross" --native-dir "$BUNDLE_DIR/native" \
            --mode baseline --source-commit "$baseline_source" --source-tree "$baseline_tree" \
            --runtime-source-commit "$baseline_source" --runtime-source-tree "$baseline_tree" \
            --runtime-source-subtree "$vm_tree" --runtime-native-bridges-sha256 "$bridge_hash" \
            --runtime-subtree-matches-candidate \
            --probe-source-commit "$PROBE_SOURCE_COMMIT" \
            --out "$RESULT_DIR/I06/baseline"
          python3 tools/linux_image_ownership_730.py run \
            --mode baseline --out "$RESULT_DIR/I06/baseline"

      - name: Prepare and run corrected ownership acceptance
        env:
          BUNDLE_DIR: ${{ runner.temp }}/tc730-linux-bundle
          RESULT_DIR: ${{ runner.temp }}/tc730-image-ownership-results
          PROBE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          source="$(jq -r .sourceSha "$BUNDLE_DIR/corrected-sdk-build-identity.json")"
          tree="$(jq -r .sourceTree "$BUNDLE_DIR/corrected-sdk-build-identity.json")"
          baseline_source="$(jq -r .sourceSha "$BUNDLE_DIR/build-identity.json")"
          baseline_tree="$(jq -r .sourceTree "$BUNDLE_DIR/build-identity.json")"
          vm_tree="$(jq -r .totalCrossVmTree "$BUNDLE_DIR/corrected-sdk-build-identity.json")"
          bridge_hash="$(jq -r .generatedNativeBridgesSha256 "$BUNDLE_DIR/corrected-sdk-build-identity.json")"
          python3 tools/linux_image_ownership_730.py prepare \
            --sdk-root "$BUNDLE_DIR/Corrected/TotalCross" --native-dir "$BUNDLE_DIR/native" \
            --mode fixed --source-commit "$source" --source-tree "$tree" \
            --runtime-source-commit "$baseline_source" --runtime-source-tree "$baseline_tree" \
            --runtime-source-subtree "$vm_tree" --runtime-native-bridges-sha256 "$bridge_hash" \
            --runtime-subtree-matches-candidate \
            --probe-source-commit "$PROBE_SOURCE_COMMIT" \
            --out "$RESULT_DIR/I06/candidate"
          python3 tools/linux_image_ownership_730.py run \
            --mode fixed --out "$RESULT_DIR/I06/candidate"

      - name: Print focused diagnostics on failure
        if: failure()
        env:
          RESULT_DIR: ${{ runner.temp }}/tc730-image-ownership-results
        run: |
          find "$RESULT_DIR" -type f \( -name runtime.log -o -name compile.log -o -name deploy.log \) \
            -print -exec tail -n 100 {} \; 2>/dev/null || true

      - name: Upload Linux ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc730-linux-image-ownership-results
          path: ${{ runner.temp }}/tc730-image-ownership-results
          retention-days: 30
          if-no-files-found: warn

  run-linux-cases:
    name: Run Linux cases on glibc 2.39
    needs: build-frozen-master
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tc730-linux-frozen-master-bundle
          path: ${{ runner.temp }}/tc730-linux-bundle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install headless Linux runtime libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb gdb libsdl2-2.0-0 libgl1 libegl1 libgles2 libglu1-mesa libx11-6 libxext6 libxrender1 libfontconfig1

      - name: Fetch and verify official 7.2.2 release package
        env:
          GH_TOKEN: ${{ secrets.PERFORMANCE_LAB_GH_TOKEN || github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/tc730-releases"
          gh release download v7.2.2 --repo TotalCross/totalcross \
            --pattern TotalCross-7.2.2.zip --dir "$RUNNER_TEMP/tc730-releases"
          echo 'ba72e64d08874321da9df52b2042e84bee10800723fa97749ce224988b0a0a06  '"$RUNNER_TEMP/tc730-releases/TotalCross-7.2.2.zip" | sha256sum --check
          sha256sum "$RUNNER_TEMP/tc730-releases/TotalCross-7.2.2.zip" > "$RUNNER_TEMP/tc730-releases/7.2.2-package.sha256"

      - name: Fetch and verify archived official 7.3.0 package artifact
        env:
          GH_TOKEN: ${{ secrets.PERFORMANCE_LAB_GH_TOKEN || github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/tc730-releases"
          gh api repos/TotalCross/totalcross/actions/runs/40878222908 \
            --jq '{id,head_sha,conclusion}' > "$RUNNER_TEMP/tc730-releases/7.3.0-run-metadata.json"
          test "$(gh api repos/TotalCross/totalcross/actions/runs/40878222908 --jq .head_sha)" = "5464c21e3107e3f1ce9c287b724829e2bb870c1d"
          test "$(gh api repos/TotalCross/totalcross/actions/runs/40878222908 --jq .conclusion)" = "success"
          gh api repos/TotalCross/totalcross/actions/artifacts/12899147776 \
            --jq '{id,name,digest,expired}' > "$RUNNER_TEMP/tc730-releases/7.3.0-artifact-metadata.json"
          test "$(gh api repos/TotalCross/totalcross/actions/artifacts/12899147776 --jq .name)" = "TotalCross-7.3.0"
          test "$(gh api repos/TotalCross/totalcross/actions/artifacts/12899147776 --jq .digest)" = "sha256:a966f79d9193c7ee5757cfd66d17d73fbd73a478f7debe9394d898c413f044d5"
          test "$(gh api repos/TotalCross/totalcross/actions/artifacts/12899147776 --jq .expired)" = "false"
          gh api repos/TotalCross/totalcross/actions/artifacts/12899147776/zip > "$RUNNER_TEMP/tc730-releases/7.3.0-artifact.zip"
          echo 'a966f79d9193c7ee5757cfd66d17d73fbd73a478f7debe9394d898c413f044d5  '"$RUNNER_TEMP/tc730-releases/7.3.0-artifact.zip" | sha256sum --check
          sha256sum "$RUNNER_TEMP/tc730-releases/7.3.0-artifact.zip" > "$RUNNER_TEMP/tc730-releases/7.3.0-artifact.sha256"

      - name: Capture runner identity and validate campaign contract
        env:
          RESULT_DIR: ${{ runner.temp }}/tc730-results
        run: |
          mkdir -p "$RESULT_DIR"
          python3 tools/functional_validation_730.py validate-config > "$RESULT_DIR/config-validation.json"
          python3 -m unittest discover -s tests/functional-validation -p 'test_*.py' -v > "$RESULT_DIR/harness-contract-tests.log" 2>&1
          ldd --version | head -n 1 > "$RESULT_DIR/glibc-version.txt"
          uname -a > "$RESULT_DIR/host.txt"
          cp "$RUNNER_TEMP/tc730-linux-bundle/build-identity.json" "$RESULT_DIR/frozen-master-build-identity.json"
          cp "$RUNNER_TEMP/tc730-linux-bundle/native-toolchain.txt" "$RESULT_DIR/frozen-master-native-toolchain.txt"
          cp "$RUNNER_TEMP/tc730-releases/7.3.0-artifact-metadata.json" "$RESULT_DIR/official-7.3.0-artifact-metadata.json"
          cp "$RUNNER_TEMP/tc730-releases/7.3.0-run-metadata.json" "$RESULT_DIR/official-7.3.0-run-metadata.json"
          cp "$RUNNER_TEMP/tc730-releases/"*.sha256 "$RESULT_DIR/"
          cat > "$RESULT_DIR/revisions.json" <<'JSON'
          {
            "official-7.2.2": {
              "tag": "v7.2.2",
              "sourceSha": "153fd11b03ea7004b08d2f61183650faeaf0bc16",
              "releaseAssetId": 463654239,
              "packageSha256": "ba72e64d08874321da9df52b2042e84bee10800723fa97749ce224988b0a0a06"
            },
            "official-7.3.0": {
              "sourceSha": "5464c21e3107e3f1ce9c287b724829e2bb870c1d",
              "workflowRunId": 40878222908,
              "artifactId": 12899147776,
              "artifactSha256": "a966f79d9193c7ee5757cfd66d17d73fbd73a478f7debe9394d898c413f044d5",
              "nestedPackageSha256": "c9552cb95e1a09798637ad74266f91b62c6ea0ddc3d8dafa8402ac987f70288e"
            },
            "frozen-master": {
              "sourceSha": "6b915883dd202f6db891990f6c3af26fb645ecc7"
            }
          }
          JSON

      - name: Build startup probes for all pinned revisions
        env:
          RESULT_DIR: ${{ runner.temp }}/tc730-results
          BUNDLE_DIR: ${{ runner.temp }}/tc730-linux-bundle
          RELEASE_DIR: ${{ runner.temp }}/tc730-releases
        run: |
          python3 tools/functional_validation_730.py build-probe --kind startup \
            --package "$RELEASE_DIR/TotalCross-7.2.2.zip" --out "$RUNNER_TEMP/probes/7.2.2-startup"
          python3 tools/functional_validation_730.py build-probe --kind startup \
            --package "$RELEASE_DIR/7.3.0-artifact.zip" --out "$RUNNER_TEMP/probes/7.3.0-startup"
          python3 tools/functional_validation_730.py build-probe --kind startup \
            --sdk-root "$BUNDLE_DIR/TotalCross" --native-dir "$BUNDLE_DIR/native" \
            --out "$RUNNER_TEMP/probes/frozen-master-startup"
          for revision in 7.2.2 7.3.0 frozen-master; do
            mkdir -p "$RESULT_DIR/build-$revision"
            cp "$RUNNER_TEMP/probes/$revision-startup/"{compile.log,jar.log,deploy.log,prepared.json} "$RESULT_DIR/build-$revision/"
          done
          jq -e '.sdkJarSha256 == "5f6d5c7f6f08f8635aa648497320bf547b310c6a3c9073659421f1167ff0efe4" and .linuxLibtcvmSha256 == "3d8a081d6510e5c2a1e05e38c26b0467180f871af1c5ed0501739bf158341dde" and .linuxLauncherSha256 == "3f8b78f4864681b91cde95443b10a488846b696e62fee1766d071eb7fec3c723"' "$RESULT_DIR/build-7.2.2/prepared.json" > /dev/null
          jq -e '.sdkJarSha256 == "23a0e5f16146414419c43f418d554f494d6acad362aa0e03ca11e11bfd430475" and .linuxLibtcvmSha256 == "94e823963427a67decdb2aaeb99722e297e375a7d772b438ef85cae1449160fb" and .linuxLauncherSha256 == "444d78555242d1bfd0401967a59430003f6eaa8e602eda53c733f59554794baa"' "$RESULT_DIR/build-7.3.0/prepared.json" > /dev/null

      - name: Run unmodified startup paths
        env:
          RESULT_DIR: ${{ runner.temp }}/tc730-results
        run: |
          ulimit -c 0
          for revision in 7.2.2 7.3.0 frozen-master; do
            install="$RUNNER_TEMP/probes/$revision-startup/deployed/install/linux"
            python3 tools/functional_validation_730.py run-startup --install-dir "$install" \
              --scenario normal-path --out "$RESULT_DIR/I01-B/$revision" --work-dir "$RUNNER_TEMP/scenario-work/$revision/normal"
            python3 tools/functional_validation_730.py run-startup --install-dir "$install" \
              --scenario short-path --out "$RESULT_DIR/I01-B/$revision" --work-dir "/tmp/tc730-short-$revision"
            for scenario in long-path symlink; do
              python3 tools/functional_validation_730.py run-startup --install-dir "$install" \
                --scenario "$scenario" --out "$RESULT_DIR/I01-B/$revision" --work-dir "$RUNNER_TEMP/scenario-work/$revision/$scenario"
            done
          done

      - name: Capture native stacks for aborted Linux startups
        env:
          RESULT_DIR: ${{ runner.temp }}/tc730-results
        run: |
          ulimit -c 0
          for revision in 7.2.2 7.3.0 frozen-master; do
            for scenario in normal-path short-path long-path symlink; do
              result="$RESULT_DIR/I01-B/$revision/$scenario/result.json"
              process_rc="$(jq -r '.observed.processReturnCode // empty' "$result")"
              if [ "$process_rc" = 134 ]; then
                runtime_dir="$(jq -r '.observed.workingDirectory' "$result")"
                launch_path="$(jq -r '.observed.launchPath' "$result")"
                (
                  cd "$runtime_dir"
                  xvfb-run -a env "LD_LIBRARY_PATH=$runtime_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
                    gdb --batch --quiet \
                      -ex 'set pagination off' \
                      -ex 'set debuginfod enabled off' \
                      -ex run \
                      -ex 'thread apply all bt' \
                      --args "$launch_path"
                ) > "$RESULT_DIR/I01-B/$revision/$scenario/gdb-stack.log" 2>&1 || true
              fi
            done
          done

      - name: Build and run frozen-master PNG probe without a shim
        env:
          RESULT_DIR: ${{ runner.temp }}/tc730-results
          BUNDLE_DIR: ${{ runner.temp }}/tc730-linux-bundle
        run: |
          ulimit -c 0
          python3 tools/functional_validation_730.py build-probe --kind png \
            --sdk-root "$BUNDLE_DIR/TotalCross" --native-dir "$BUNDLE_DIR/native" \
            --out "$RUNNER_TEMP/probes/frozen-master-png"
          mkdir -p "$RESULT_DIR/build-frozen-master-png"
          cp "$RUNNER_TEMP/probes/frozen-master-png/"{compile.log,jar.log,deploy.log,prepared.json} "$RESULT_DIR/build-frozen-master-png/"
          python3 tools/functional_validation_730.py run-png \
            --install-dir "$RUNNER_TEMP/probes/frozen-master-png/deployed/install/linux" \
            --out "$RESULT_DIR/I02/frozen-master/unmodified"

      - name: Apply the test-only startup shim only when startup blocked PNG
        env:
          RESULT_DIR: ${{ runner.temp }}/tc730-results
        run: |
          ulimit -c 0
          unmodified="$RESULT_DIR/I02/frozen-master/unmodified/result.json"
          startup_ok="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["observed"]["startupMarker"]).lower())' "$unmodified")"
          if [ "$startup_ok" = false ]; then
            cc -shared -fPIC -O2 -o "$RUNNER_TEMP/realpath-compat-test-only.so" \
              investigations/7.3.0-functional/cases/linux-startup/realpath-compat-test-only.c
            python3 tools/functional_validation_730.py run-png \
              --install-dir "$RUNNER_TEMP/probes/frozen-master-png/deployed/install/linux" \
              --shim "$RUNNER_TEMP/realpath-compat-test-only.so" --ld-debug \
              --out "$RESULT_DIR/I02/frozen-master/conditional-shim"
          fi

      - name: Print focused diagnostics on failure
        if: failure()
        env:
          RESULT_DIR: ${{ runner.temp }}/tc730-results
        run: |
          find "$RESULT_DIR" -type f \( -name runtime.log -o -name compile.log -o -name deploy.log \) -print -exec tail -n 100 {} \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tc730-linux-functional-results
          path: ${{ runner.temp }}/tc730-results
          retention-days: 30
          if-no-files-found: warn
