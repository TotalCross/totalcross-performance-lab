name: iOS graphics / 7.3.0 direct-ChildView experiment / AWS Device Farm

on:
  # Controlled 7.3.0 experiment: use source SHA a6e03d03 with only the
  # historical ChildView hierarchy restored. Push builds consume no AWS devices;
  # paid runs require manual execute=true or the single approved commit.
  push:
    branches:
      - test/sqlite-plaintext-7.3.0
    paths:
      - .github/workflows/ios-graphics-730-experiment.yml
      - tools/ios_graphics_730_experiment_build.py
      - tools/devicefarm_ios.py
      - tests/ios-graphics/**
  workflow_dispatch:
    inputs:
      execute:
        description: "Run a billable graphics test on one physical iPhone"
        type: boolean
        required: true
        default: false
      collect_run_arn:
        description: "Recover a previously scheduled run (no new device)"
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: ios-graphics-730-directview-${{ github.ref }}-${{ github.event_name }}
  # An approved one-time push can schedule a billable run. Never cancel
  # in-flight physical tests when additional commits arrive.
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_DEVICE_FARM_PROJECT_ARN: ${{ vars.AWS_DEVICE_FARM_PROJECT_ARN }}
  AWS_DEVICE_FARM_DEVICE_POOL_ARN: ${{ vars.AWS_DEVICE_FARM_DEVICE_POOL_ARN }}

jobs:
  build-graphics:
    name: Build cross-platform iOS graphics IPA and Appium package (Linux)
    if: github.event_name == 'push' || (inputs.collect_run_arn == '')
    # The TotalCross Java deployer cross-packages the iOS IPA on Linux;
    # no Apple toolchain, local signing, or simulator is used.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify helper scripts and Device Farm spec
        shell: bash
        run: |
          python -m py_compile tools/ios_graphics_730_experiment_build.py tools/devicefarm_ios.py tests/ios-graphics/devicefarm/tests/test_ios_graphics.py
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          import yaml
          spec=yaml.safe_load(open('tests/ios-graphics/devicefarm/devicefarm-test-spec.yml'))
          assert spec['version'] == 0.1 and 'test' in spec['phases']
          print('iOS graphics Appium test spec validated')
          PY
      - name: Fetch exact successful 7.3.0 experimental SDK build (no AWS charges)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERFORMANCE_LAB_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p ios-graphics-results
          run_id=43297490948
          artifact_id=13981700539
          expected_sha=a6e03d0327250a7992202b33799983386093da1c
          expected_digest=sha256:c635dc37179d1e4e0ec13343421b52ba2565bad6870a217bbbbda143ceb5bae1
          gh api "repos/TotalCross/totalcross/actions/runs/${run_id}" \
            --jq '{id,head_sha,status,conclusion}' > ios-graphics-results/sdk-run.json
          python - <<'PY'
          import json
          data=json.load(open("ios-graphics-results/sdk-run.json"))
          assert data["id"] == 43297490948
          assert data["head_sha"] == "a6e03d0327250a7992202b33799983386093da1c"
          assert data["status"] == "completed" and data["conclusion"] == "success"
          PY
          gh api "repos/TotalCross/totalcross/actions/artifacts/${artifact_id}" \
            --jq '{id,name,digest,size_in_bytes,expired,workflow_run: {id: .workflow_run.id, head_sha: .workflow_run.head_sha}}' > ios-graphics-results/sdk-artifact.json
          python - <<'PY'
          import json
          data=json.load(open("ios-graphics-results/sdk-artifact.json"))
          assert data["id"] == 13981700539
          assert data["name"] == "TotalCross-7.3.0"
          assert data["digest"] == "sha256:c635dc37179d1e4e0ec13343421b52ba2565bad6870a217bbbbda143ceb5bae1"
          assert data["expired"] is False
          assert data["workflow_run"]["id"] == 43297490948
          assert data["workflow_run"]["head_sha"] == "a6e03d0327250a7992202b33799983386093da1c"
          PY
          gh api "repos/TotalCross/totalcross/actions/artifacts/${artifact_id}/zip" > ios-graphics-results/official-artifact.zip
          python - <<'PY'
          import hashlib, pathlib, zipfile
          path=pathlib.Path("ios-graphics-results/official-artifact.zip")
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual=="c635dc37179d1e4e0ec13343421b52ba2565bad6870a217bbbbda143ceb5bae1", f"Experimental SDK ZIP hash mismatch: {actual}"
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              assert archive.namelist() == ["TotalCross-7.3.0.zip"]
          print("Verified experimental SDK archive:", path, actual)
          PY
      - name: Compile and package only the graphics app for iOS
        shell: bash
        run: |
          python tools/ios_graphics_730_experiment_build.py \
            --package ios-graphics-results/official-artifact.zip \
            --out ios-graphics-results \
            --enable-file-sharing
      - name: Package offline Appium graphics assertions
        shell: bash
        run: |
          # The common Device Farm helper imports boto3 for API operations.
          # Packaging itself remains offline/no AWS requests.
          python -m pip install --disable-pip-version-check boto3
          mkdir -p tests/ios-graphics/devicefarm/wheelhouse
          python -m pip download --only-binary=:all: \
            --dest tests/ios-graphics/devicefarm/wheelhouse \
            --requirement tests/ios-graphics/devicefarm/requirements.txt
          python tools/devicefarm_ios.py package \
            --test-root tests/ios-graphics/devicefarm \
            --out ios-graphics-results
      - name: Upload build and reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-graphics-730-directview-build
          path: |
            ios-graphics-results/
            !ios-graphics-results/official-sdk/**
            !ios-graphics-results/official-artifact.zip
            !ios-graphics-results/classes/**
          retention-days: 30
          if-no-files-found: warn
      - name: Show build summary
        if: failure()
        run: |
          for file in ios-graphics-results/compile.log ios-graphics-results/deploy.log; do
            if test -f "$file"; then echo "=== $file ==="; tail -n 120 "$file"; fi
          done

  physical-graphics-test:
    name: Render graphics / physical iPhone Device Farm (billable, opt-in)
    # Only the explicitly approved, single-purpose commit can also schedule on push.
    # All future pushes are build-only; manual runs still require execute=true.
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.execute == true && inputs.collect_run_arn == '') ||
      (github.event_name == 'push' && github.event.head_commit.message == 'run(ios): one-time Device Farm directview test with isolated concurrency')
    needs: build-graphics
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ios-graphics-730-directview-build
          path: ios-graphics-results
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEVICE_FARM_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: TotalCrossGraphicsIOS
      - name: Install AWS Device Farm client
        run: python -m pip install --disable-pip-version-check boto3
      - name: Verify selected iPhone pool and historical-run read permissions
        run: python tools/devicefarm_ios.py validate --out ios-graphics-results
      - name: Schedule graphics smoke and collect complete logs/video/screenshots
        shell: bash
        run: |
          python tools/devicefarm_ios.py run --execute \
            --test-root tests/ios-graphics/devicefarm \
            --run-name "TotalCross-7.3.0-iOS-Graphics-DirectChildView" \
            --ipa ios-graphics-results/deployed/install/ios/ios-graphics-smoke.ipa \
            --out ios-graphics-results
      - name: Publish graphics Device Farm execution and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-graphics-730-directview-physical-device
          path: |
            ios-graphics-results/
            !ios-graphics-results/deployed/**
            !ios-graphics-results/devicefarm-appium-python.zip
          retention-days: 30
          if-no-files-found: warn

  collect-graphics-run:
    name: Recover existing iOS graphics run (free)
    if: github.event_name == 'workflow_dispatch' && inputs.execute == false && inputs.collect_run_arn != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXISTING_RUN_ARN: ${{ inputs.collect_run_arn }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEVICE_FARM_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: TotalCrossGraphicsCollect
      - run: python -m pip install --disable-pip-version-check boto3
      - name: Recover existing run without CreateUpload or ScheduleRun
        shell: bash
        run: |
          python tools/devicefarm_ios.py collect \
            --run-arn "$EXISTING_RUN_ARN" \
            --out ios-graphics-results
      - name: Publish recovered graphics logs/screenshots/videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-graphics-730-directview-recovered
          path: ios-graphics-results/
          retention-days: 30
          if-no-files-found: warn
