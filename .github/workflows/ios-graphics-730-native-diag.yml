# Register 7.3.0 iOS graphics diagnostics for manual execution
#
# GitHub Actions only exposes workflow_dispatch when the workflow file exists
# on the repository's default branch. This main-branch version intentionally
# performs NO deployment. To run the real test, use Actions > this workflow >
# Run workflow and select branch test/sqlite-plaintext-7.3.0.
#
# The branch-specific version at the SAME path builds the pinned diagnostics
# IPA and runs AWS Device Farm only when execute=true. No scheduled or push
# triggers are defined in this default-branch registration stub.
name: iOS graphics / 7.3.0 native diagnostics / AWS Device Farm

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Run a billable graphics test on one physical iPhone"
        type: boolean
        required: true
        default: false
      collect_run_arn:
        description: "Recover a previously scheduled run (no new device)"
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  select-diagnostic-branch:
    name: Select the diagnostic test branch (no AWS usage)
    runs-on: ubuntu-24.04
    steps:
      - name: No-op default branch registration
        run: |
          echo "::error::This is the default-branch registration stub; no device was scheduled."
          echo "::error::Choose the test/sqlite-plaintext-7.3.0 branch in the Run workflow menu."
          exit 1
