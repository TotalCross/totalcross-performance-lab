name: iOS graphics / 7.3.0 native diagnostics / AWS Device Farm

on:
  # Diagnostics of the original 7.3.0 graphics regression.
  # Push triggers build-only; physical AWS tests are always manual and billable.
  push:
    branches:
      - test/sqlite-plaintext-7.3.0
    paths:
      - .github/workflows/ios-graphics-730-native-diag.yml
      - tools/ios_graphics_730_native_diag_build.py
      - tools/devicefarm_ios.py
      - tests/ios-graphics/**
  workflow_dispatch:
    inputs:
      execute:
        description: "Run a billable graphics test on one physical iPhone"
        type: boolean
        required: true
        default: false
      collect_run_arn:
        description: "Recover a previously scheduled run (no new device)"
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: ios-graphics-730-native-diag-${{ github.ref }}-${{ github.event_name }}
  # Never cancel a physical test; no paid run starts from pushes.
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_DEVICE_FARM_PROJECT_ARN: ${{ vars.AWS_DEVICE_FARM_PROJECT_ARN }}
  AWS_DEVICE_FARM_DEVICE_POOL_ARN: ${{ vars.AWS_DEVICE_FARM_DEVICE_POOL_ARN }}

jobs:
  build-graphics:
    name: Build cross-platform iOS graphics IPA and Appium package (Linux)
    if: github.event_name == 'push' || (inputs.collect_run_arn == '')
    # The TotalCross Java deployer cross-packages the iOS IPA on Linux;
    # no Apple toolchain, local signing, or simulator is used.
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify helper scripts and Device Farm spec
        shell: bash
        run: |
          python -m py_compile tools/ios_graphics_730_native_diag_build.py tools/devicefarm_ios.py tests/ios-graphics/devicefarm/tests/test_ios_graphics.py
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          import yaml
          spec=yaml.safe_load(open('tests/ios-graphics/devicefarm/devicefarm-test-spec.yml'))
          assert spec['version'] == 0.1 and 'test' in spec['phases']
          print('iOS graphics Appium test spec validated')
          PY
      - name: Verify and download the pinned instrumented 7.3.0 SDK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERFORMANCE_LAB_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p ios-graphics-results
          run_id=43306936627
          expected_sha=d1fa0fa4b9186cce4bc1d1f4bdf91872713a3954

          # Wait only for this specific successful build, never for a branch's
          # latest package. This job does not interact with AWS at all.
          for i in $(seq 1 180); do
            gh api "repos/TotalCross/totalcross/actions/runs/${run_id}" \
              --jq '{id,head_sha,status,conclusion}' > ios-graphics-results/sdk-run.json
            status="$(python -c 'import json;print(json.load(open("ios-graphics-results/sdk-run.json"))["status"])')"
            sha="$(python -c 'import json;print(json.load(open("ios-graphics-results/sdk-run.json"))["head_sha"])')"
            test "${sha}" = "${expected_sha}" || { echo "Unexpected SDK SHA"; exit 1; }
            if [ "${status}" = completed ]; then
              python - <<'PY'
          import json
          run=json.load(open("ios-graphics-results/sdk-run.json"))
          assert run["id"] == 43306936627
          assert run["head_sha"] == "d1fa0fa4b9186cce4bc1d1f4bdf91872713a3954"
          assert run["conclusion"] == "success", f"SDK CI failed: {run['conclusion']}"
          PY
              break
            fi
            test "${i}" -lt 180 || { echo "SDK not completed within 90 minutes"; exit 1; }
            sleep 30
          done

          gh api "repos/TotalCross/totalcross/actions/runs/${run_id}/artifacts?per_page=100" \
            --jq '.artifacts' > ios-graphics-results/sdk-artifacts.json
          python - <<'PY'
          import json
          a=json.load(open("ios-graphics-results/sdk-artifacts.json"))
          matches=[x for x in a if x["name"]=="TotalCross-7.3.0" and not x["expired"]]
          assert len(matches)==1, f"Expected one immutable packaged SDK artifact: {matches}"
          artifact=matches[0]
          assert artifact["workflow_run"]["id"]==43306936627
          assert artifact["workflow_run"]["head_sha"]=="d1fa0fa4b9186cce4bc1d1f4bdf91872713a3954"
          assert artifact["digest"].startswith("sha256:")
          with open("ios-graphics-results/sdk-artifact.json","w") as f:
              json.dump({k:artifact[k] for k in ("id","name","digest","size_in_bytes","expired")},f,indent=2)
          PY
          artifact_id="$(python -c 'import json;print(json.load(open("ios-graphics-results/sdk-artifact.json"))["id"])')"
          gh api "repos/TotalCross/totalcross/actions/artifacts/${artifact_id}/zip" \
            > ios-graphics-results/official-artifact.zip
          python - <<'PY'
          import hashlib,json,zipfile
          p="ios-graphics-results/official-artifact.zip"
          d=json.load(open("ios-graphics-results/sdk-artifact.json"))
          with open(p,"rb") as f: digest="sha256:"+hashlib.sha256(f.read()).hexdigest()
          assert digest==d["digest"],f"SDK artifact digest mismatch: {digest}"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert z.namelist()==["TotalCross-7.3.0.zip"]
          print("Verified 7.3.0 native-diagnostic SDK",d)
          PY
      - name: Compile and package only the graphics app for iOS
        shell: bash
        run: |
          python tools/ios_graphics_730_native_diag_build.py \
            --package ios-graphics-results/official-artifact.zip \
            --out ios-graphics-results \
            --enable-file-sharing
      - name: Package offline Appium graphics assertions
        shell: bash
        run: |
          # The common Device Farm helper imports boto3 for API operations.
          # Packaging itself remains offline/no AWS requests.
          python -m pip install --disable-pip-version-check boto3
          mkdir -p tests/ios-graphics/devicefarm/wheelhouse
          python -m pip download --only-binary=:all: \
            --dest tests/ios-graphics/devicefarm/wheelhouse \
            --requirement tests/ios-graphics/devicefarm/requirements.txt
          python tools/devicefarm_ios.py package \
            --test-root tests/ios-graphics/devicefarm \
            --out ios-graphics-results
      - name: Upload build and reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-graphics-730-native-diag-build
          path: |
            ios-graphics-results/
            !ios-graphics-results/official-sdk/**
            !ios-graphics-results/official-artifact.zip
            !ios-graphics-results/classes/**
          retention-days: 30
          if-no-files-found: warn
      - name: Show build summary
        if: failure()
        run: |
          for file in ios-graphics-results/compile.log ios-graphics-results/deploy.log; do
            if test -f "$file"; then echo "=== $file ==="; tail -n 120 "$file"; fi
          done

  physical-graphics-test:
    name: Render graphics / physical iPhone Device Farm (billable, opt-in)
    # NEVER schedule a paid AWS device on push. Explicit manual opt-in only.
    if: github.event_name == 'workflow_dispatch' && inputs.execute == true && inputs.collect_run_arn == ''
    needs: build-graphics
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ios-graphics-730-native-diag-build
          path: ios-graphics-results
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEVICE_FARM_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: TotalCrossGraphicsIOS
      - name: Install AWS Device Farm client
        run: python -m pip install --disable-pip-version-check boto3
      - name: Verify selected iPhone pool and historical-run read permissions
        run: python tools/devicefarm_ios.py validate --out ios-graphics-results
      - name: Schedule graphics smoke and collect complete logs/video/screenshots
        shell: bash
        run: |
          python tools/devicefarm_ios.py run --execute \
            --test-root tests/ios-graphics/devicefarm \
            --run-name "TotalCross-7.3.0-iOS-Native-Graphics-Diagnostics" \
            --ipa ios-graphics-results/deployed/install/ios/ios-graphics-smoke.ipa \
            --out ios-graphics-results
      - name: Publish graphics Device Farm execution and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-graphics-730-native-diag-physical-device
          path: |
            ios-graphics-results/
            !ios-graphics-results/deployed/**
            !ios-graphics-results/devicefarm-appium-python.zip
          retention-days: 30
          if-no-files-found: warn

  collect-graphics-run:
    name: Recover existing iOS graphics run (free)
    if: github.event_name == 'workflow_dispatch' && inputs.execute == false && inputs.collect_run_arn != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXISTING_RUN_ARN: ${{ inputs.collect_run_arn }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEVICE_FARM_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: TotalCrossGraphicsCollect
      - run: python -m pip install --disable-pip-version-check boto3
      - name: Recover existing run without CreateUpload or ScheduleRun
        shell: bash
        run: |
          python tools/devicefarm_ios.py collect \
            --run-arn "$EXISTING_RUN_ARN" \
            --out ios-graphics-results
      - name: Publish recovered graphics logs/screenshots/videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-graphics-730-native-diag-recovered
          path: ios-graphics-results/
          retention-days: 30
          if-no-files-found: warn
