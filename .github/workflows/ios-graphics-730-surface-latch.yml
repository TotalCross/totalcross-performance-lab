name: iOS graphics / 7.3.0 surface-latch experiment / AWS Device Farm

on:
  # Isolated experiment on 7.3.0: release the latched initial surface-change flag.
  # Push triggers build-only; physical AWS tests are always manual and billable.
  push:
    branches:
      - test/sqlite-plaintext-7.3.0
    paths:
      - .github/workflows/ios-graphics-730-surface-latch.yml
      - tools/ios_graphics_730_surface_latch_build.py
      - tools/devicefarm_ios.py
      - tests/ios-graphics/**
  workflow_dispatch:
    inputs:
      execute:
        description: "Run a billable graphics test on one physical iPhone"
        type: boolean
        required: true
        default: false
      collect_run_arn:
        description: "Recover a previously scheduled run (no new device)"
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: ios-graphics-730-surface-latch-v2-${{ github.ref }}-${{ github.event_name }}
  # Supersede obsolete push-only builds; never cancel manual Device Farm runs.
  # event_name is part of the group, so paid workflow_dispatch is isolated.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  AWS_REGION: us-west-2
  AWS_DEVICE_FARM_PROJECT_ARN: ${{ vars.AWS_DEVICE_FARM_PROJECT_ARN }}
  AWS_DEVICE_FARM_DEVICE_POOL_ARN: ${{ vars.AWS_DEVICE_FARM_DEVICE_POOL_ARN }}

jobs:
  build-graphics:
    name: Build cross-platform iOS graphics IPA and Appium package (Linux)
    if: github.event_name == 'push' || (inputs.collect_run_arn == '')
    # The TotalCross Java deployer cross-packages the iOS IPA on Linux;
    # no Apple toolchain, local signing, or simulator is used.
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify helper scripts and Device Farm spec
        shell: bash
        run: |
          python -m py_compile tools/ios_graphics_730_surface_latch_build.py tools/devicefarm_ios.py tests/ios-graphics/devicefarm/tests/test_ios_graphics.py
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          import yaml
          spec=yaml.safe_load(open('tests/ios-graphics/devicefarm/devicefarm-test-spec.yml'))
          assert spec['version'] == 0.1 and 'test' in spec['phases']
          print('iOS graphics Appium test spec validated')
          PY
      - name: Verify pinned iOS/package jobs and download 7.3.0 latch experiment SDK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERFORMANCE_LAB_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p ios-graphics-results
          expected_run=43326093367
          expected_sha=791e8c465ccfb8c9e0d34588a5467ea9d033c762
          # The SDK package is pinned to an immutable run and source commit.
          # Poll only the iOS + packaging jobs, not unrelated macOS desktop tests.
          for i in $(seq 1 160); do
            gh api "repos/TotalCross/totalcross/actions/runs/${expected_run}" \
              --jq '{id,head_sha,name,status,conclusion}' > ios-graphics-results/sdk-run.json
            gh api "repos/TotalCross/totalcross/actions/runs/${expected_run}/jobs?per_page=100" \
              --jq '.jobs' > ios-graphics-results/sdk-jobs.json
            state="$(python - <<'PY'
          import json
          run=json.load(open("ios-graphics-results/sdk-run.json"))
          jobs=json.load(open("ios-graphics-results/sdk-jobs.json"))
          assert run["id"]==43326093367 and run["head_sha"]=="791e8c465ccfb8c9e0d34588a5467ea9d033c762"
          assert run["name"]=="Packages `totalcross`"
          state=[]
          for label in ("build / Build `iOS`","Package TotalCross"):
              matches=[job for job in jobs if job["name"]==label]
              if not matches:
                  state.append("waiting")
                  continue
              assert len(matches)==1, f"Ambiguous job {label}"
              job=matches[0]
              if job["status"] == "completed":
                  assert job["conclusion"]=="success", f"Failed required job {label}: {job['conclusion']}"
              else:
                  state.append("waiting")
          print("ready" if not state else "waiting")
          PY
          )"
            if [ "${state}" = ready ]; then break; fi
            test "${i}" -lt 160 || { echo "Required SDK jobs did not complete in 80 minutes"; exit 1; }
            sleep 30
          done

          gh api "repos/TotalCross/totalcross/actions/runs/${expected_run}/artifacts?per_page=100" \
            --jq '.artifacts' > ios-graphics-results/sdk-artifacts.json
          python - <<'PY'
          import json
          a=json.load(open("ios-graphics-results/sdk-artifacts.json"))
          selected=[x for x in a if x["name"]=="TotalCross-7.3.0" and not x["expired"]]
          assert len(selected)==1, f"Expected exactly one package artifact, got {len(selected)}"
          item=selected[0]
          assert item["workflow_run"]["id"]==43326093367
          assert item["workflow_run"]["head_sha"]=="791e8c465ccfb8c9e0d34588a5467ea9d033c762"
          assert item["digest"].startswith("sha256:")
          with open("ios-graphics-results/sdk-artifact.json","w") as f:
              json.dump({k:item[k] for k in ("id","name","digest","size_in_bytes","expired")},f,indent=2)
          PY
          artifact_id="$(python -c 'import json;print(json.load(open("ios-graphics-results/sdk-artifact.json"))["id"])')"
          gh api "repos/TotalCross/totalcross/actions/artifacts/${artifact_id}/zip" \
            > ios-graphics-results/official-artifact.zip
          python - <<'PY'
          import hashlib,json,zipfile
          p="ios-graphics-results/official-artifact.zip"
          d=json.load(open("ios-graphics-results/sdk-artifact.json"))
          with open(p,"rb") as f:
              actual="sha256:"+hashlib.sha256(f.read()).hexdigest()
          assert actual==d["digest"],f"Artifact digest mismatch: {actual}"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert z.namelist()==["TotalCross-7.3.0.zip"]
          print("Verified source-pinned surface-latch SDK:",d)
          PY
      - name: Compile and package only the graphics app for iOS
        shell: bash
        run: |
          python tools/ios_graphics_730_surface_latch_build.py \
            --package ios-graphics-results/official-artifact.zip \
            --out ios-graphics-results \
            --enable-file-sharing
      - name: Package offline Appium graphics assertions
        shell: bash
        run: |
          # The common Device Farm helper imports boto3 for API operations.
          # Packaging itself remains offline/no AWS requests.
          python -m pip install --disable-pip-version-check boto3
          mkdir -p tests/ios-graphics/devicefarm/wheelhouse
          python -m pip download --only-binary=:all: \
            --dest tests/ios-graphics/devicefarm/wheelhouse \
            --requirement tests/ios-graphics/devicefarm/requirements.txt
          python tools/devicefarm_ios.py package \
            --test-root tests/ios-graphics/devicefarm \
            --out ios-graphics-results
      - name: Upload build and reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-graphics-730-surface-latch-build
          path: |
            ios-graphics-results/
            !ios-graphics-results/official-sdk/**
            !ios-graphics-results/official-artifact.zip
            !ios-graphics-results/classes/**
          retention-days: 30
          if-no-files-found: warn
      - name: Show build summary
        if: failure()
        run: |
          for file in ios-graphics-results/compile.log ios-graphics-results/deploy.log; do
            if test -f "$file"; then echo "=== $file ==="; tail -n 120 "$file"; fi
          done

  physical-graphics-test:
    name: Render graphics / physical iPhone Device Farm (billable, opt-in)
    # NEVER schedule a paid AWS device on push. Explicit manual opt-in only.
    if: github.event_name == 'workflow_dispatch' && inputs.execute == true && inputs.collect_run_arn == ''
    needs: build-graphics
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ios-graphics-730-surface-latch-build
          path: ios-graphics-results
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEVICE_FARM_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: TotalCrossGraphicsIOS
      - name: Install AWS Device Farm client
        run: python -m pip install --disable-pip-version-check boto3
      - name: Verify selected iPhone pool and historical-run read permissions
        run: python tools/devicefarm_ios.py validate --out ios-graphics-results
      - name: Schedule graphics smoke and collect complete logs/video/screenshots
        shell: bash
        run: |
          python tools/devicefarm_ios.py run --execute \
            --test-root tests/ios-graphics/devicefarm \
            --run-name "TotalCross-7.3.0-iOS-SurfaceLatch-Experiment" \
            --ipa ios-graphics-results/deployed/install/ios/ios-graphics-smoke.ipa \
            --out ios-graphics-results
      - name: Publish graphics Device Farm execution and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-graphics-730-surface-latch-physical-device
          path: |
            ios-graphics-results/
            !ios-graphics-results/deployed/**
            !ios-graphics-results/devicefarm-appium-python.zip
          retention-days: 30
          if-no-files-found: warn

  collect-graphics-run:
    name: Recover existing iOS graphics run (free)
    if: github.event_name == 'workflow_dispatch' && inputs.execute == false && inputs.collect_run_arn != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXISTING_RUN_ARN: ${{ inputs.collect_run_arn }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEVICE_FARM_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: TotalCrossGraphicsCollect
      - run: python -m pip install --disable-pip-version-check boto3
      - name: Recover existing run without CreateUpload or ScheduleRun
        shell: bash
        run: |
          python tools/devicefarm_ios.py collect \
            --run-arn "$EXISTING_RUN_ARN" \
            --out ios-graphics-results
      - name: Publish recovered graphics logs/screenshots/videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-graphics-730-surface-latch-recovered
          path: ios-graphics-results/
          retention-days: 30
          if-no-files-found: warn
