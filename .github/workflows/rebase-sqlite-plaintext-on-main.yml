name: One-time rebase of SQLite test branch onto main
on:
  push:
    branches:
      - rebase/sqlite-plaintext-7.3.0-on-main-20261113
    paths:
      - .github/workflows/rebase-sqlite-plaintext-on-main.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.PERFORMANCE_LAB_GH_TOKEN || github.token }}
      - name: Rebase locally, verify it, and update only the test branch
        shell: bash
        env:
          ORIGINAL: c39ef61cde7b91310be6bdbf116a6ad733ab2295
          BASE_MAIN: 39fa3ffa8e412df0504f5fc5712dd74e9eeeb69a
          MERGE_BASE: fa4a65b7553553acaadeac107fd199968167d254
          TARGET: test/sqlite-plaintext-7.3.0
        run: |
          set -euo pipefail
          git config user.name 'TotalCross CI Rebase'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/test/sqlite-plaintext-7.3.0:refs/remotes/origin/test/sqlite-plaintext-7.3.0'
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse "origin/$TARGET")" = "$ORIGINAL"
          test "$(git merge-base "$ORIGINAL" "$BASE_MAIN")" = "$MERGE_BASE"
          echo 'Rebasing 107 original, linear commits onto main with git rebase'
          git checkout -B local-rebased "$ORIGINAL"
          export GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true
          if ! git rebase --onto "$BASE_MAIN" "$MERGE_BASE" local-rebased -X ours; then
             # The final historical cleanup commit deleted the former graphics
             # workflow, while main now owns its reusable replacement. Preserve
             # main's file, and refuse to resolve ANY other unanticipated conflict.
             conflict="$(git diff --name-only --diff-filter=U)"
             rebasing="$(git rev-parse REBASE_HEAD)"
             if [ "$conflict" = ".github/workflows/ios-graphics-devicefarm.yml" ] &&
                [ "$rebasing" = "$ORIGINAL" ]; then
                 echo "Resolving known final cleanup modify/delete conflict by preserving main workflow"
                 test -f .github/workflows/ios-graphics-devicefarm.yml
                 git add .github/workflows/ios-graphics-devicefarm.yml
                 git rebase --continue
             else
                 echo "::error::Unexpected rebase conflict. No remote branch was modified."
                 git status --short || true
                 git ls-files -u || true
                 git rebase --abort || true
                 exit 1
             fi
          fi
          echo 'Rebase finished; verifying essential files'
          test -f .github/workflows/ios-graphics-devicefarm.yml
          test -f tools/ios_graphics_sdk_build.py
          test -f tools/verify_ios_sdk_artifact.py
          test -f .github/workflows/sqlite-plaintext-7.3.0.yml
          test -f reports/ios-graphics-730-surface-latch.md
          test -f tests/sqlite-plaintext/src/totalcross/lab/sqlite/SQLitePlaintextProbe.java
          test ! -f .github/workflows/ios-graphics-730-native-diag.yml

          # The runner's GitHub App can push code but lacks the special
          # GitHub workflows permission. Keep the EXACT main workflow directory
          # in every rewritten commit; after publishing we will restore the
          # SQLite-specific workflows and the one manual-branch guard through
          # the GitHub connector, which has workflow-write permission.
          echo "Rewriting ONLY workflow directory changes in rebased commits"
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch --force --index-filter '
             git rm -r --cached -q --ignore-unmatch .github/workflows
             git ls-tree -r "$BASE_MAIN" -- .github/workflows | git update-index --index-info
          ' -- "$BASE_MAIN"..HEAD
          test "$(git merge-base HEAD "$BASE_MAIN")" = "$BASE_MAIN"
          test -z "$(git diff --name-only "$BASE_MAIN"...HEAD -- .github/workflows)"
          for file in \
            tests/sqlite-plaintext/src/totalcross/lab/sqlite/SQLitePlaintextProbe.java \
            tools/sqlite_smoke.py \
            reports/ios-graphics-730-native-diagnostics.md \
            reports/ios-graphics-730-surface-latch.md \
            tests/ios-graphics/README.md; do
              test "$(git rev-parse "$ORIGINAL:$file")" = "$(git rev-parse "HEAD:$file")"
          done
          echo 'Rebased branch compared to main:'
          git log --oneline --max-count=8
          git diff --stat "$BASE_MAIN"...HEAD
          test "$(git rev-parse origin/$TARGET)" = "$ORIGINAL"
          echo 'Pushing rebased code only with lease; workflow changes restored separately'
          git push --force-with-lease="refs/heads/$TARGET:$ORIGINAL" origin "HEAD:refs/heads/$TARGET"
          echo 'Successfully rebased test branch and preserved its old head in backup'

