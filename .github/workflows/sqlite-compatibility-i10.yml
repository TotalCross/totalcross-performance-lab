name: TotalCross 7.3.0 I10 SQLite compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - investigation/totalcross-7.3.0-functional-validation
    paths:
      - .github/workflows/sqlite-compatibility-i10.yml
      - investigations/7.3.0-functional/cases/sqlite-compatibility/**
      - tools/sqlite_compatibility_i10.py

permissions:
  actions: read
  contents: read

jobs:
  windows-win32-i386:
    name: Win32 I386 SQLite matrix and fixture origin
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and verify pinned SDK and runtime inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERFORMANCE_LAB_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          I10_ROOT="$(cygpath -u "$RUNNER_TEMP")/tc730-i10/windows-win32-i386"
          mkdir -p "$I10_ROOT/inputs/official-722" "$I10_ROOT/inputs/official-730" \
            "$I10_ROOT/inputs/candidate-sdk" "$I10_ROOT/inputs/candidate-win32"
          test "$(gh api repos/TotalCross/totalcross/releases/tags/v7.2.2 --jq .tag_name)" = v7.2.2
          gh release download v7.2.2 --repo TotalCross/totalcross \
            --pattern TotalCross-7.2.2.zip --dir "$I10_ROOT/inputs/official-722"
          echo 'ba72e64d08874321da9df52b2042e84bee10800723fa97749ce224988b0a0a06  '"$I10_ROOT/inputs/official-722/TotalCross-7.2.2.zip" | sha256sum --check
          gh api repos/TotalCross/totalcross/actions/runs/40878222908 \
            --jq '{id,head_sha,conclusion}' > "$I10_ROOT/inputs/official-730/run.json"
          test "$(gh api repos/TotalCross/totalcross/actions/runs/40878222908 --jq .head_sha)" = \
            "5464c21e3107e3f1ce9c287b724829e2bb870c1d"
          test "$(gh api repos/TotalCross/totalcross/actions/runs/40878222908 --jq .conclusion)" = success
          test "$(gh api repos/TotalCross/totalcross/actions/artifacts/12899147776 --jq .digest)" = \
            "sha256:a966f79d9193c7ee5757cfd66d17d73fbd73a478f7debe9394d898c413f044d5"
          test "$(gh api repos/TotalCross/totalcross/actions/artifacts/12899147776 --jq .expired)" = false
          gh api repos/TotalCross/totalcross/actions/artifacts/12899147776/zip \
            > "$I10_ROOT/inputs/official-730/official-artifact.zip"
          echo 'a966f79d9193c7ee5757cfd66d17d73fbd73a478f7debe9394d898c413f044d5  '"$I10_ROOT/inputs/official-730/official-artifact.zip" | sha256sum --check
          gh run download 45884551862 --repo TotalCross/totalcross \
            --name sdk-build-fixed --dir "$I10_ROOT/inputs/candidate-sdk"
          gh run download 45907759163 --repo TotalCross/totalcross \
            --name windows-fixed-win32-runtime --dir "$I10_ROOT/inputs/candidate-win32"
          python3 - "$I10_ROOT" <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          from pathlib import Path

          root = Path(sys.argv[1])
          expected = ("94af2b8b653cad509994b5ccf3dbb60ac28ef920",
                      "539f5b424b6f4593c7d96074d69ff077a38ed361")
          with tarfile.open(root / "inputs/candidate-sdk/sdk-build.tar.gz", "r:gz") as archive:
              sdk_provenance = archive.extractfile("build-provenance.json")
              if sdk_provenance is None:
                  raise SystemExit("SDK artifact has no build provenance")
              sdk = json.load(sdk_provenance)
          runtime = json.loads((root / "inputs/candidate-win32/build-provenance.json").read_text())
          manifest = json.loads((root / "inputs/candidate-win32/win32-build-manifest.json").read_text())
          for name, identity in (("SDK", sdk), ("Win32 runtime", runtime)):
              source = identity.get("source", {})
              if (source.get("commit"), source.get("tree")) != expected:
                  raise SystemExit(name + " provenance mismatch")
          if manifest.get("configuration") != "Visual Studio 17 2022; Win32; Release":
              raise SystemExit("candidate runtime is not the production Win32/I386 Release build")
          if manifest.get("graphics") != {"gles": False, "legacyRenderer": False,
                  "nativeWindowing": False, "sdlWindowing": True, "skia": True,
                  "softwareSurface": True}:
              raise SystemExit("candidate Win32 graphics configuration mismatch")
          vm = root / "inputs/candidate-win32/tcvm.dll"
          if hashlib.sha256(vm.read_bytes()).hexdigest() != \
                  "000d9d2ae734659383db9266b7e5c2db0e056de78ebbee68383142f7d797af52":
              raise SystemExit("candidate Win32 tcvm.dll hash mismatch")
          print("Verified the exact corrected SDK and Win32/I386 runtime")
          PY

      - name: Stage the three SDK and runtime revisions
        shell: bash
        run: |
          set -euo pipefail
          export I10_ROOT="$RUNNER_TEMP/tc730-i10/windows-win32-i386"
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          root = Path(os.environ["I10_ROOT"])
          spec = importlib.util.spec_from_file_location("i10", "tools/sqlite_compatibility_i10.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          staged = root / "staged"
          staged.mkdir()
          official_722 = module.stage_official(
              root / "inputs/official-722/TotalCross-7.2.2.zip", staged / "official-7.2.2")
          official_730 = module.stage_official(
              root / "inputs/official-730/official-artifact.zip", staged / "official-7.3.0")
          candidate = module.stage_candidate(
              root / "inputs/candidate-sdk/sdk-build.tar.gz", "windows-i386",
              root / "inputs/candidate-win32", staged / "candidate-94af")
          expected = {
              official_722 / "dist/totalcross-sdk.jar": "5f6d5c7f6f08f8635aa648497320bf547b310c6a3c9073659421f1167ff0efe4",
              official_730 / "dist/totalcross-sdk.jar": "23a0e5f16146414419c43f418d554f494d6acad362aa0e03ca11e11bfd430475",
              candidate / "dist/totalcross-sdk.jar": "a18c80e2784543493370d1120afc3e2d10d7594b51e5032d1f779f1f51c2f12d",
              candidate / "dist/vm/win32/tcvm.dll": "000d9d2ae734659383db9266b7e5c2db0e056de78ebbee68383142f7d797af52",
          }
          for path, digest in expected.items():
              if module.sha256(path) != digest:
                  raise SystemExit("staged input hash mismatch: " + str(path))
          print("Staged official 7.2.2, official 7.3.0, and candidate SDKs")
          PY

      - name: Run Win32 I386 compatibility and create transfer fixtures
        shell: bash
        run: |
          set -euo pipefail
          I10_ROOT="$(cygpath -u "$RUNNER_TEMP")/tc730-i10/windows-win32-i386"
          python3 tools/sqlite_compatibility_i10.py --target windows-i386 \
            --sdk-722 "$I10_ROOT/staged/official-7.2.2/unpacked/TotalCross" \
            --sdk-730 "$I10_ROOT/staged/official-7.3.0/nested/TotalCross" \
            --sdk-candidate "$I10_ROOT/staged/candidate-94af/TotalCross" \
            --create-fixtures --out "$I10_ROOT/results"

      - name: Upload cross-platform transfer fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc730-i10-windows-win32-fixtures
          path: ${{ runner.temp }}/tc730-i10/windows-win32-i386/results/fixtures/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Win32 I386 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc730-i10-windows-win32-i386
          path: |
            ${{ runner.temp }}/tc730-i10/windows-win32-i386/results/
            !${{ runner.temp }}/tc730-i10/windows-win32-i386/results/builds/**/classes/**
            !${{ runner.temp }}/tc730-i10/windows-win32-i386/results/builds/**/Main.jar
            !${{ runner.temp }}/tc730-i10/windows-win32-i386/results/builds/**/deployed/install/**
          if-no-files-found: warn
          retention-days: 30

  linux-x86_64:
    name: Linux x86_64 SQLite matrix with the test-only startup shim
    needs: windows-win32-i386
    if: ${{ always() && needs.windows-win32-i386.result != 'cancelled' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the native runner architecture
        run: test "$(uname -m)" = x86_64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux GUI libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libsdl2-2.0-0 libgl1 libegl1 libgles2 libglu1-mesa libx11-6 libxext6 libxrender1 libfontconfig1
      - uses: actions/download-artifact@v4
        with:
          name: tc730-i10-windows-win32-fixtures
          path: ${{ runner.temp }}/tc730-i10/fixtures
          repository: TotalCross/totalcross-performance-lab
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: tc730-linux-frozen-master-bundle
          path: ${{ runner.temp }}/tc730-i10/inputs/linux-bundle
          repository: TotalCross/totalcross-performance-lab
          run-id: 45978158503
          github-token: ${{ github.token }}
      - name: Fetch pinned official and candidate inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERFORMANCE_LAB_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          I10_ROOT="$RUNNER_TEMP/tc730-i10"
          mkdir -p "$I10_ROOT/inputs/official-722" "$I10_ROOT/inputs/official-730" \
            "$I10_ROOT/inputs/candidate-sdk"
          test "$(gh api repos/TotalCross/totalcross/releases/tags/v7.2.2 --jq .tag_name)" = v7.2.2
          gh release download v7.2.2 --repo TotalCross/totalcross \
            --pattern TotalCross-7.2.2.zip --dir "$I10_ROOT/inputs/official-722"
          echo 'ba72e64d08874321da9df52b2042e84bee10800723fa97749ce224988b0a0a06  '"$I10_ROOT/inputs/official-722/TotalCross-7.2.2.zip" | sha256sum --check
          test "$(gh api repos/TotalCross/totalcross/actions/artifacts/12899147776 --jq .digest)" = \
            "sha256:a966f79d9193c7ee5757cfd66d17d73fbd73a478f7debe9394d898c413f044d5"
          gh api repos/TotalCross/totalcross/actions/artifacts/12899147776/zip \
            > "$I10_ROOT/inputs/official-730/official-artifact.zip"
          echo 'a966f79d9193c7ee5757cfd66d17d73fbd73a478f7debe9394d898c413f044d5  '"$I10_ROOT/inputs/official-730/official-artifact.zip" | sha256sum --check
          gh run download 45884551862 --repo TotalCross/totalcross \
            --name sdk-build-fixed --dir "$I10_ROOT/inputs/candidate-sdk"
          cc -shared -fPIC -O2 -o "$I10_ROOT/realpath-compat-test-only.so" \
            investigations/7.3.0-functional/cases/linux-startup/realpath-compat-test-only.c
      - name: Stage the three SDK and runtime revisions
        shell: bash
        env:
          I10_ROOT: ${{ runner.temp }}/tc730-i10
        run: |
          set -euo pipefail
          export I10_ROOT="$RUNNER_TEMP/tc730-i10"
          jq -e '.sourceSha == "6b915883dd202f6db891990f6c3af26fb645ecc7" and .totalCrossVmTree == "7b288d4f732a01c9e87ad5290b628cad7e56c513"' \
            "$I10_ROOT/inputs/linux-bundle/build-identity.json" >/dev/null
          jq -e '.sourceSha == "94af2b8b653cad509994b5ccf3dbb60ac28ef920" and .totalCrossVmTree == "7b288d4f732a01c9e87ad5290b628cad7e56c513" and .nativeSourceTreeMatchesBaseline == true and .nativeBridgeInputsMatchBaseline == true' \
            "$I10_ROOT/inputs/linux-bundle/corrected-sdk-build-identity.json" >/dev/null
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          root = Path(os.environ["I10_ROOT"])
          spec = importlib.util.spec_from_file_location("i10", "tools/sqlite_compatibility_i10.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          staged = root / "staged"
          staged.mkdir()
          module.stage_official(root / "inputs/official-722/TotalCross-7.2.2.zip",
                                staged / "official-7.2.2")
          module.stage_official(root / "inputs/official-730/official-artifact.zip",
                                staged / "official-7.3.0")
          module.stage_candidate(root / "inputs/candidate-sdk/sdk-build.tar.gz", "linux-x86_64",
                                 root / "inputs/linux-bundle", staged / "candidate-94af")
          checks = {
              staged / "official-7.2.2/unpacked/TotalCross/dist/totalcross-sdk.jar": "5f6d5c7f6f08f8635aa648497320bf547b310c6a3c9073659421f1167ff0efe4",
              staged / "official-7.3.0/nested/TotalCross/dist/totalcross-sdk.jar": "23a0e5f16146414419c43f418d554f494d6acad362aa0e03ca11e11bfd430475",
              staged / "candidate-94af/TotalCross/dist/totalcross-sdk.jar": "a18c80e2784543493370d1120afc3e2d10d7594b51e5032d1f779f1f51c2f12d",
              staged / "candidate-94af/TotalCross/dist/vm/linux/libtcvm.so": "99cd2a97e86c553460ddf982ece3951bb6e62056ac2b31494f6f6c82250453e4",
          }
          for path, digest in checks.items():
              if module.sha256(path) != digest:
                  raise SystemExit("staged input hash mismatch: " + str(path))
          PY
      - name: Run Linux x86_64 compatibility matrix
        shell: bash
        run: |
          set -euo pipefail
          I10_ROOT="$RUNNER_TEMP/tc730-i10"
          python3 tools/sqlite_compatibility_i10.py --target linux-x86_64 \
            --sdk-722 "$I10_ROOT/staged/official-7.2.2/unpacked/TotalCross" \
            --sdk-730 "$I10_ROOT/staged/official-7.3.0/nested/TotalCross" \
            --sdk-candidate "$I10_ROOT/staged/candidate-94af/TotalCross" \
            --fixture-dir "$I10_ROOT/fixtures" \
            --linux-shim "$I10_ROOT/realpath-compat-test-only.so" \
            --out "$I10_ROOT/linux-x86_64/results"
      - name: Upload Linux x86_64 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc730-i10-linux-x86_64
          path: |
            ${{ runner.temp }}/tc730-i10/linux-x86_64/results/
            !${{ runner.temp }}/tc730-i10/linux-x86_64/results/builds/**/classes/**
            !${{ runner.temp }}/tc730-i10/linux-x86_64/results/builds/**/Main.jar
            !${{ runner.temp }}/tc730-i10/linux-x86_64/results/builds/**/deployed/install/**
          if-no-files-found: warn
          retention-days: 30

  macos-arm64:
    name: macOS ARM64 SQLite matrix
    needs: windows-win32-i386
    if: ${{ always() && needs.windows-win32-i386.result != 'cancelled' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the native runner architecture
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: tc730-i10-windows-win32-fixtures
          path: ${{ runner.temp }}/tc730-i10/fixtures
          repository: TotalCross/totalcross-performance-lab
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: tc730-i07-macos-arm64
          path: ${{ runner.temp }}/tc730-i10/inputs/candidate-macos
          repository: TotalCross/totalcross-performance-lab
          run-id: 45989644203
          github-token: ${{ github.token }}
      - name: Fetch pinned official and candidate SDK inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERFORMANCE_LAB_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          I10_ROOT="$RUNNER_TEMP/tc730-i10"
          mkdir -p "$I10_ROOT/inputs/official-722" "$I10_ROOT/inputs/official-730" \
            "$I10_ROOT/inputs/candidate-sdk"
          test "$(gh api repos/TotalCross/totalcross/releases/tags/v7.2.2 --jq .tag_name)" = v7.2.2
          gh release download v7.2.2 --repo TotalCross/totalcross \
            --pattern TotalCross-7.2.2.zip --dir "$I10_ROOT/inputs/official-722"
          echo 'ba72e64d08874321da9df52b2042e84bee10800723fa97749ce224988b0a0a06  '"$I10_ROOT/inputs/official-722/TotalCross-7.2.2.zip" | shasum -a 256 -c
          test "$(gh api repos/TotalCross/totalcross/actions/artifacts/12899147776 --jq .digest)" = \
            "sha256:a966f79d9193c7ee5757cfd66d17d73fbd73a478f7debe9394d898c413f044d5"
          gh api repos/TotalCross/totalcross/actions/artifacts/12899147776/zip \
            > "$I10_ROOT/inputs/official-730/official-artifact.zip"
          echo 'a966f79d9193c7ee5757cfd66d17d73fbd73a478f7debe9394d898c413f044d5  '"$I10_ROOT/inputs/official-730/official-artifact.zip" | shasum -a 256 -c
          gh run download 45884551862 --repo TotalCross/totalcross \
            --name sdk-build-fixed --dir "$I10_ROOT/inputs/candidate-sdk"
      - name: Stage the three SDK and runtime revisions
        shell: bash
        env:
          I10_ROOT: ${{ runner.temp }}/tc730-i10
        run: |
          set -euo pipefail
          export I10_ROOT="$RUNNER_TEMP/tc730-i10"
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["I10_ROOT"])
          provenance = json.loads((root / "inputs/candidate-macos/artifact-provenance.json").read_text())
          if (provenance.get("sdkSourceCommit"), provenance.get("sdkSourceTree")) != (
                  "94af2b8b653cad509994b5ccf3dbb60ac28ef920",
                  "539f5b424b6f4593c7d96074d69ff077a38ed361"):
              raise SystemExit("candidate macOS runtime provenance mismatch")
          spec = importlib.util.spec_from_file_location("i10", "tools/sqlite_compatibility_i10.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          staged = root / "staged"
          staged.mkdir()
          module.stage_official(root / "inputs/official-722/TotalCross-7.2.2.zip",
                                staged / "official-7.2.2")
          module.stage_official(root / "inputs/official-730/official-artifact.zip",
                                staged / "official-7.3.0")
          module.stage_candidate(root / "inputs/candidate-sdk/sdk-build.tar.gz", "macos-arm64",
                                 root / "inputs/candidate-macos", staged / "candidate-94af")
          checks = {
              staged / "official-7.2.2/unpacked/TotalCross/dist/totalcross-sdk.jar": "5f6d5c7f6f08f8635aa648497320bf547b310c6a3c9073659421f1167ff0efe4",
              staged / "official-7.3.0/nested/TotalCross/dist/totalcross-sdk.jar": "23a0e5f16146414419c43f418d554f494d6acad362aa0e03ca11e11bfd430475",
              staged / "candidate-94af/TotalCross/dist/totalcross-sdk.jar": "a18c80e2784543493370d1120afc3e2d10d7594b51e5032d1f779f1f51c2f12d",
              staged / "candidate-94af/TotalCross/dist/vm/macos/libtcvm.dylib": "f841231778c7a5d2af82192163aa71ecd8634c9203ff4ce6bfb4b5bde703ca2e",
          }
          for path, digest in checks.items():
              if module.sha256(path) != digest:
                  raise SystemExit("staged input hash mismatch: " + str(path))
          PY
      - name: Run macOS ARM64 compatibility matrix
        shell: bash
        run: |
          set -euo pipefail
          I10_ROOT="$RUNNER_TEMP/tc730-i10"
          python3 tools/sqlite_compatibility_i10.py --target macos-arm64 \
            --sdk-722 "$I10_ROOT/staged/official-7.2.2/unpacked/TotalCross" \
            --sdk-730 "$I10_ROOT/staged/official-7.3.0/nested/TotalCross" \
            --sdk-candidate "$I10_ROOT/staged/candidate-94af/TotalCross" \
            --fixture-dir "$I10_ROOT/fixtures" --out "$I10_ROOT/macos-arm64/results"
      - name: Upload macOS ARM64 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc730-i10-macos-arm64
          path: |
            ${{ runner.temp }}/tc730-i10/macos-arm64/results/
            !${{ runner.temp }}/tc730-i10/macos-arm64/results/builds/**/classes/**
            !${{ runner.temp }}/tc730-i10/macos-arm64/results/builds/**/Main.jar
            !${{ runner.temp }}/tc730-i10/macos-arm64/results/builds/**/deployed/install/**
          if-no-files-found: warn
          retention-days: 30
