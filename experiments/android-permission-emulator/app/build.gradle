plugins {
    id 'com.android.application'
}

android {
    namespace 'totalcross.android'
    compileSdk 36

    defaultConfig {
        applicationId 'totalcross.permissionprobe'
        minSdk 24
        targetSdk (findProperty('probeTargetSdk') ?: '36').toString().toInteger()
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
