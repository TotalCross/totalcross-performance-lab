version: 0.1
# Physical Android devices, no emulator or Appium accessibility requirement.
# Appium-Python test package is an ADB-based unittest suite, executed in the
# Amazon Linux 2023 custom test host with the physical device attached.
android_test_host: amazon_linux_2023

phases:
  install:
    commands:
      - devicefarm-cli use python 3.12
      - python --version
      - adb version

  pre_test:
    commands:
      - |-
        set -e
        echo "Device Farm physical device: $DEVICEFARM_DEVICE_NAME"
        echo "OS version: $DEVICEFARM_DEVICE_OS_VERSION"
        echo "Application path: $DEVICEFARM_APP_PATH"
        adb devices -l
        adb shell getprop ro.build.version.sdk
        adb shell getprop ro.build.version.release
        adb shell getprop ro.product.cpu.abilist
        adb shell pm path totalcross.apprvks || true
        mkdir -p "$DEVICEFARM_LOG_DIR"

  test:
    commands:
      - |-
        set -o pipefail
        cd "$DEVICEFARM_TEST_PACKAGE_PATH"
        python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$DEVICEFARM_LOG_DIR/unittest.log"
        exit ${PIPESTATUS[0]}

  post_test:
    commands:
      - echo "Saved actual Android version, permission states, logcat, SQLite stages and test summary."

artifacts:
  - $DEVICEFARM_LOG_DIR
